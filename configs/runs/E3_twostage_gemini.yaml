# E3_twostage_gemini: E3 as a TWO-STAGE review, like the human process: abstract screening (lenient),
# then the full paper (team PDF -> PubMed Central -> open-access PDF) is judged strictly;
# extraction and annotation read the full paper. See docs/agents/fulltext-eligibility.md.
# Gemini models; needs Gemini access (see docs/MODELS.md).
#   python -m adrd_review.graph.runner configs/runs/E3_twostage_gemini.yaml
name: E3_twostage_gemini
condition: E3
description: "E3 two-stage - abstract screening, then full-text eligibility, extraction and annotation from the full paper"
part: calibration
concurrency: 2

roles:
  triage:     {model: {provider: google, model: gemini-3.5-flash-lite, max_tokens: 1024, requests_per_minute: 10}}
  extraction: {model: {provider: google, model: gemini-3.8-flash, requests_per_minute: 10}}

panel:
  - id: A
    persona: >-
      a clinical neurologist who diagnoses dementia. You pay closest attention to whether the target
      condition, the test being evaluated and the reference-standard diagnosis are clinically sound.
    model: {provider: google, model: gemini-3.8-flash, requests_per_minute: 10}
  - id: B
    persona: >-
      an epidemiologist. You pay closest attention to who was studied, where they were recruited,
      and whether the sample and setting match what the review asks for.
    model: {provider: google, model: gemini-3.7-flash, requests_per_minute: 10}
  - id: C
    persona: >-
      a research methodologist. You pay closest attention to study design, data sources, and whether
      diagnostic accuracy can actually be assessed from the study.
    model: {provider: google, model: gemini-3.5-flash, requests_per_minute: 10}

# ---- added for E3 ----
# FREE-TIER KEY? gemini-3.1-pro-preview (the adjudicator) has NO free tier. On a free key, change
# the adjudicator model below to gemini-3.8-flash (see docs/MODELS.md).
adjudicator: {provider: google, model: gemini-3.1-pro-preview, max_tokens: 2048, requests_per_minute: 5}
escalate_below: 0.6
verifier:
  enabled: true
  model: {provider: google, model: gemini-3.5-flash-lite, max_tokens: 1024, requests_per_minute: 10}
human: none

# ---- two-stage ----
eligibility: fulltext          # stage 2 on the full paper
eligibility_max_chars: 80000   # whole paper for almost every article
pdf_dir: data/pdfs             # the team's PDFs, named <PMID>.pdf
# Full-text calls are ~11,000 tokens each: this needs Gemini (Groq's free tier cannot do it).
