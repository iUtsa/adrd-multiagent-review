  groq:openai/gpt-oss-120b:     {input: 0.0, output: 0.0, free_tier: true}
  groq:openai/gpt-oss-20b:      {input: 0.0, output: 0.0, free_tier: true}
  groq:qwen/qwen3.8-27b:        {input: 0.0, output: 0.0, free_tier: true}
