# Gemini API paid-tier prices, USD per 1 million tokens (checked 2026-09-30 at
# https://ai.google.dev/gemini-api/docs/pricing). Output prices include thinking tokens.
# Flash 3.6-3.8 prices double on 2027-01-01. Re-check before estimating.
checked: "2026-09-30"
models:
  google:gemini-3.8-flash:      {input: 0.75, output: 3.75, free_tier: true}
  google:gemini-3.7-flash:      {input: 0.75, output: 3.75, free_tier: true}
  google:gemini-3.6-flash:      {input: 0.75, output: 3.75, free_tier: true}
  google:gemini-3.5-flash:      {input: 1.50, output: 9.00, free_tier: true}
  google:gemini-3.5-flash-lite: {input: 0.30, output: 2.50, free_tier: true}
  google:gemini-3.1-pro-preview: {input: 2.00, output: 12.00, free_tier: false}  # prompts <= 200k tokens
  # Anthropic, incl. prompt-cache read and 5-minute write rates (checked 2026-10-10 at https://platform.claude.com/docs/en/about-claude/pricing; base rates,
  # no prompt caching or batch discount assumed)
  anthropic:claude-haiku-5-5:   {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125, free_tier: false}  # prompts up to 100k tokens
  anthropic:claude-sonnet-5-5:  {input: 2.00, output: 10.00, cache_read: 0.1, cache_write: 2.5, free_tier: false}
  anthropic:claude-sonnet-4-6:  {input: 3.00, output: 15.00, cache_read: 0.3, cache_write: 3.75, free_tier: false}
  anthropic:claude-opus-5-5:    {input: 4.00, output: 20.00, cache_read: 0.2, cache_write: 5.0, free_tier: false}
  anthropic:claude-fable-5-1:   {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.5, free_tier: false}
  # OpenAI (checked 2026-10-10 at https://developers.openai.com/api/docs/pricing; standard tier)
  openai:gpt-6-luna:            {input: 0.10, output: 0.50, free_tier: false}
  openai:gpt-6-sol:             {input: 2.00, output: 10.00, free_tier: false}
  openai:gpt-6.1-sol:           {input: 2.00, output: 10.00, free_tier: false}
  openai:gpt-5.4-mini:          {input: 0.75, output: 4.50, free_tier: false}
